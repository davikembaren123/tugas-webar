<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas WebAR Kelompok</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #111; font-family: sans-serif; }
        model-viewer { width: 100%; height: 100%; }
        .ar-button {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #4F46E5; color: white; border: none; padding: 12px 24px;
            font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <script src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <model-viewer 
        src="scene.gltf" 
        ios-src="model.usdz"
        alt="Objek 3D Tugas AR" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate>
        
        <button slot="ar-button" class="ar-button">
            Tampilkan di Dunia Nyata (AR)
        </button>
    </model-viewer>

</body>
</html>
